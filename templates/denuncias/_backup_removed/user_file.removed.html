{% extends 'denunciasstyle>
{% endblock %}
{% block content %}
<div class="container">
  <div class="file-card">
    <h2>Expediente del usuario<label><span>{{ target_user.username }}<div>
        <div class="item"><label>Nombre<span><label><span>{{ target_user.email }}<div>
        <div class="item"><label>Empresa<span><label><span>{{ target_user.role|default:"—" }}<div>
        <div class="item"><label>Área<span><label><span>{{ target_user.branch|default:"—" }}<div>
        <div class="item"><label>Matrícula<span><label><span>{{ target_user.phone_number|default:"—" }}<div>
        <div class="item"><label>Ingreso<span><label><span>{{ target_user.employment_end|date:"Y-m-d"|default:"—" }}<div>
      <h3>
        <p class="muted">Total: {{ conflict_count }}. Listado visible solo para superusuario.<th><th>Fecha<th><th>Actor<th><th>Denunciante<tr>
            <a><td>
                <td>{{ c.get_status_display }}<td>
                <td>{{ c.actor_matricula|default:"—" }}<td>
              <td><tbody>
          <div>
      <div>
  <div>
{% endblock %}
