# Configuracion de Nginx para el stack de Docker Compose.
# Se monta en /etc/nginx/conf.d/default.conf (ver docker-compose.yml).
#
# Habla con el contenedor "web" (Gunicorn) por la red interna de Docker,
# y sirve los estaticos y las subidas desde los volumenes compartidos.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Estaticos recolectados con "collectstatic".
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Adjuntos y evidencias son privados: solo se sirven por Django con permisos.
    location ^~ /media/attachments/ { return 404; }
    location ^~ /media/evidence_previews/ { return 404; }

    # Archivos publicos (avisos de privacidad, biblioteca GSI).
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Todo lo demas se reenvia a Gunicorn.
    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

