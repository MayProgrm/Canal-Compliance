# Configuracion de ejemplo de Nginx para el Canal de Denuncias.
#
# En un VPS (Ubuntu/Debian):
#   sudo cp nginx.conf /etc/nginx/sites-available/canal_denuncias
#   sudo ln -s /etc/nginx/sites-available/canal_denuncias /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Con Docker Compose: se monta en /etc/nginx/conf.d/default.conf
# y el upstream cambia a "web:8000" (ver comentario en el bloque de proxy).
#
# Antes de usarlo, reemplaza:
#   - tu-dominio.com  -> tu dominio real
#   - /home/canal_denuncias/canal_denuncias -> ruta real del proyecto
#
# Nota: los encabezados de seguridad (HSTS, CSP, etc.) ya los envia Django
# desde su middleware, por eso no se repiten aqui.

# Redirige todo el trafico HTTP a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    # Necesario para que certbot pueda validar el dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu-dominio.com www.tu-dominio.com;

    # Certificados (Let's Encrypt con certbot). En Docker usa /etc/nginx/ssl/.
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamano maximo de subida (ajusta si se suben archivos grandes).
    client_max_body_size 25M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Estaticos recolectados con "collectstatic".
    location /static/ {
        alias /home/canal_denuncias/canal_denuncias/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Archivos subidos (adjuntos, etc.).
    location /media/ {
        alias /home/canal_denuncias/canal_denuncias/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Todo lo demas se reenvia a Gunicorn (Django).
    location / {
        # En un VPS: http://127.0.0.1:8000
        # Con Docker Compose: http://web:8000
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Necesario para que Django detecte la peticion como HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
